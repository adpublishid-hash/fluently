name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: Server (syntax, unit tests, API smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fluently
          POSTGRES_PASSWORD: fluently
          POSTGRES_DB: fluently
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluently"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: fluently
      DB_USER: fluently
      DB_PASSWORD: fluently
      PORT: 4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node --check index.js
      - run: npm test
      - name: API smoke test
        run: |
          node index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "PostgreSQL connected" server.log; then break; fi
            sleep 1
          done
          grep -q "PostgreSQL connected" server.log || { cat server.log; exit 1; }
          curl -fsS localhost:4000/api/health
          npm run smoke
